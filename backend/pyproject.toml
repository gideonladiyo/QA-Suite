[project]
name = "qa-portal-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1", "alembic>=1.15,<2",
  "itsdangerous>=2.2,<3", "httpx>=0.28,<1", "email-validator>=2.2,<3",
  "cryptography>=46,<52",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app/modules/qa_reports/tests", "app/modules/micro_utilities/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
